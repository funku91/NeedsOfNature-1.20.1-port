name: Build needsofnature

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:  # Allow manual triggering

jobs:
  build:
    name: Build on Ubuntu
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build needsofnature module
        run: ./gradlew clean build --no-daemon --console=plain

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: needsofnature-build
          path: |
            animationdirector/build/libs/animationdirector-1.20.1-1.3.1-port.1.jar
            needsofnature/build/libs/needsofnature-1.20.1-1.3.1-port.1.jar
          if-no-files-found: ignore
          retention-days: 7
